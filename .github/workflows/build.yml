name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK with High Memory Heap
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        # Cấp phát tối đa 4GB RAM cho Gradle để chống lỗi OutOfMemoryError
        ORG_GRADLE_PROJECT_jvmargs: "-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bac163af429817f4bb2ce91ad5d1df216bfa" > $ANDROID_HOME/licenses/android-sdk-license
        
        # Chạy build trực tiếp với cấu hình bộ nhớ mở rộng
        gradle assembleDebug --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/
