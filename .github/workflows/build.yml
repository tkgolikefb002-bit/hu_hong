name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Wrapper and Build Debug APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bac163af429817f4bb2ce91ad5d1df216bfa" > $ANDROID_HOME/licenses/android-sdk-license
        
        # Sinh file gradlew chuẩn và cấp quyền thực thi
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
        
        # Build trực tiếp bằng gradlew sinh ra để nạp đầy đủ các task Android
        ./gradlew assembleDebug --stacktrace
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/
