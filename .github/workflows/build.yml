name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Find and Build Android Project
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        GRADLE_OPTS: "-Xmx4g -Dfile.encoding=UTF-8"
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bac163af429817f4bb2ce91ad5d1df216bfa" > $ANDROID_HOME/licenses/android-sdk-license
        
        # Tìm thư mục chứa build.gradle.kts của ứng dụng
        PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "build.gradle.kts" | grep -v "^\./build.gradle.kts$" | head -n 1))
        if [ "$PROJECT_DIR" != "." ] && [ -n "$PROJECT_DIR" ]; then
          echo "Found project directory at: $PROJECT_DIR"
          cd $PROJECT_DIR
          echo "sdk.dir=$ANDROID_HOME" > local.properties
        fi
        
        # Thực hiện build và làm mới toàn bộ dependency để giải quyết triệt để lỗi Compose BOM
        gradle clean assembleDebug --refresh-dependencies --console=plain
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/'
