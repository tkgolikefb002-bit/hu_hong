name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Locate Project and Build Debug APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        GRADLE_OPTS: "-Xmx4g -Dfile.encoding=UTF-8"
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bac163af429817f4bb2ce91ad5d1df216bfa" > $ANDROID_HOME/licenses/android-sdk-license
        
        # Tìm xem build.gradle hoặc settings.gradle đang nằm ở thư mục nào
        echo "Searching for gradle files:"
        find . -name "settings.gradle*" -o -name "build.gradle*"
        
        # Nếu có gradlew thì dùng, nếu không thì tự tạo wrapper chuẩn
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.4
        fi
        chmod +x gradlew
        
        # Chạy build và xuất lỗi chi tiết đầy đủ
        ./gradlew assembleDebug --stacktrace --info
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/'
